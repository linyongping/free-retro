name: Tests

# Deploys run through Cloudflare's Git integration on push, not here. These
# tests therefore do not gate a deploy: a push to main ships whether they pass
# or not. They are here to tell you when main is broken, so treat a failure as
# "fix forward" rather than "the deploy was blocked".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # never let a first-run telemetry prompt stall the job
  WRANGLER_SEND_METRICS: "false"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The suite exercises the real Worker over HTTP against a local D1, so it
      # needs the schema applied and a passcode configured — the auth test
      # asserts that an unauthenticated request is rejected, which only holds
      # when a passcode is set.
      - name: Prepare local D1 and passcode
        run: |
          echo "SITE_PASSCODE=ci-passcode" > .dev.vars
          npx wrangler d1 execute free-retro-db --local --file=./schema.sql

      - name: Start the dev server
        run: |
          npx wrangler dev --local --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8787/; then
              echo "dev server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "dev server did not come up:"; cat /tmp/wrangler-dev.log; exit 1

      - name: Run API tests
        run: TEST_BASE=http://localhost:8787 TEST_PASSCODE=ci-passcode node --test test/api.test.mjs

      - name: Show dev server log on failure
        if: failure()
        run: cat /tmp/wrangler-dev.log
